version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deltamesh_postgres
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: deltamesh_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deltamesh_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:

[package]
name = "backend"
version = "0.1.0"
edition = "2021"
default-run = "backend"

[dependencies]
# Serialización y buffers binarios
prost = "0.13"
bytes = "1.7"

# Runtime asíncrono
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"

# Servidor HTTP y WebSockets
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Cliente WebSocket para pruebas de estrés nativas
tokio-tungstenite = "0.24"

# Bases de datos
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "macros", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager", "tls-rustls", "tokio-rustls-comp"] }
dotenvy = "0.15"

# Utilidades y Autenticación
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
jsonwebtoken = "9.3"

[dev-dependencies]
rand = "0.8"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.0"

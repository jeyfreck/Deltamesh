[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serialización y manejo de buffers binarios
prost = "0.13"
bytes = "1.7"

# Runtime asíncrono
tokio = { version = "1.40", features = ["full"] }

# Servidor HTTP y WebSockets
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Base de datos PostgreSQL con sqlx
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "macros"] }

# Utilidades de datos
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.0"
